events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;

        location /api/emr/ {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
            if ($request_method = 'OPTIONS') { return 204; }
            proxy_pass http://emr-service:8000/;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
        }

        location /api/pharmacy/ {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
            if ($request_method = 'OPTIONS') { return 204; }
            proxy_pass http://pharmacy-treatment-service:8000/;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
        }

        location /api/inpatient/ {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
            if ($request_method = 'OPTIONS') { return 204; }
            proxy_pass http://inpatient-service:8000/;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
        }

        location /api/ {
            proxy_hide_header 'Access-Control-Allow-Origin';
            proxy_hide_header 'Access-Control-Allow-Methods';
            proxy_hide_header 'Access-Control-Allow-Headers';

            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;

            if ($request_method = 'OPTIONS') { return 204; }

            proxy_pass http://host.docker.internal:8000/api/;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
